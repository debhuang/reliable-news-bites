name: Update news

on:
  schedule:
    # Cron is in UTC. 12:00 UTC = 7:00 AM New York in winter (8:00 AM in summer).
    # GitHub may start scheduled runs 15+ minutes late when it is busy.
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch feeds
        run: python scripts/fetch_news.py

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update news $(date -u +'%Y-%m-%d')"
            git push
          fi
